version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: exam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_system
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d exam_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: exam-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://exam_user:${DB_PASSWORD:-changeme}@postgres:5432/exam_system
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - exam-network
    volumes:
      - ./api/migrations:/app/migrations
      - api_logs:/app/logs

  # Frontend App
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: exam-app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - exam-network

networks:
  exam-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local
